name: Render Lean Six Sigma BTP Video

on:
  push:
    branches:
      - claude/remotion-video-creation-miq7ku
      - main
  workflow_dispatch:

jobs:
  render:
    name: Render MP4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome (Remotion headless shell)
        run: npx remotion browser ensure

      - name: Render MP4 (5m45s · 1920×1080 · 30fps)
        run: npx remotion render LeanSixSigmaBTP out/video.mp4 --overwrite --concurrency=4 --log=verbose
        timeout-minutes: 90

      - name: Upload MP4 as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lean-six-sigma-btp-video
          path: out/video.mp4
          retention-days: 30

      - name: Create GitHub Release with MP4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-latest
          name: "Lean Six Sigma dans le BTP — Vidéo MP4 (5m45s)"
          body: |
            ## Lean Six Sigma dans le BTP
            Vidéo animée Remotion · 5 min 45 sec · 1920×1080 · 30fps · 10 350 frames

            **Scènes :**
            1. Accroche — titre & stat (20s)
            2. Constat BTP — 4 indicateurs chiffrés (45s)
            3. AVANT le chantier — 5 gaspillages (70s)
            4. DMAIC — cycle Six Sigma complet (60s)
            5. 6 Outils Lean — Last Planner, 5S… (60s)
            6. APRÈS le chantier — le chantier transformé (35s)
            7. KPIs Avant/Après — tableau animé (35s)
            8. Conclusion — culture d'amélioration continue (20s)
          files: out/video.mp4
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
